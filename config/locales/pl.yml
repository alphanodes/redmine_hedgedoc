  label_hedgedoc_list_info_html: "<strong>Ważne:</strong> Wyświetlane są tutaj Twoje własne pady oraz wszystkie pady, które nie są prywatne, jeśli ich tytuł zaczyna się od identyfikatora projektu w Redmine (np. \"testproject: Mój pad\"). Takie pady są widoczne dla <em>wszystkich</em> uczestników tego projektu.<br />Poinformuj użytkowników HedgeDoc, że pady z poprawnym prefiksem projektu pojawiają się w Redmine automatycznie, o ile ich autor jest również użytkownikiem Redmine."
