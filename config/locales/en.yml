en:
  field_hedgedoc_permission: "Permission"
  label_hedgedoc_list_info_html: "<strong>Important:</strong> Listed here are your own pads and all pads that are not private, if their title starts with the identifier of a Redmine project (e.g. \"testproject: My pad\"). Such pads are shown to <em>all</em> members of that project.<br />Let your HedgeDoc users know that pads with a correct project prefix show up in Redmine automatically, as long as their author is a Redmine user as well."
  label_hedgedoc_pad_plural: "HedgeDoc pads"
  label_hedgedoc_pads: "Pads"
  label_hedgedoc_project_list_info_html: "<strong>Important:</strong> Listed here are your own pads with the prefix \"%{prefix}\" and all of them that are not private (e.g. \"%{prefix}: My pad\").<br />Let your HedgeDoc users know that pads with this project prefix show up in Redmine automatically, as long as their author is a Redmine user as well."
  label_hedgedoc_url: "HedgeDoc URL"
  label_new_hedgedoc_pad: "New HedgeDoc pad"
  label_show_hedgedoc_in_menu: "Show HedgeDoc in menu"
  label_switch_to_hedgedoc: "Switch to HedgeDoc"
