  field_hedgedoc_permission: "Berechtigung"
  label_hedgedoc_list_info_html: "<strong>Hinweis:</strong> Aufgelistet werden deine eigenen Pads und alle nicht privaten Pads, deren Titel mit der Kennung eines Redmine-Projekts beginnt (z.B. \"testprojekt: Mein Pad\"). Solche Pads werden <em>allen</em> Mitgliedern dieses Projekts angezeigt.<br />Informiere deine HedgeDoc-Benutzer, dass Pads mit korrektem Projektpräfix automatisch in Redmine erscheinen, sofern ihr Autor auch ein Redmine-Benutzer ist."
