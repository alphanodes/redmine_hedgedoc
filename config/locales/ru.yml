  label_hedgedoc_list_info_html: "<strong>Важно:</strong> Здесь перечислены ваши собственные пады и все пады, которые не являются частными, если их название начинается с идентификатора проекта Redmine (например, \"testproject: Мой пад\"). Такие пады видны <em>всем</em> участникам этого проекта.<br />Сообщите пользователям HedgeDoc, что пады с правильным префиксом проекта автоматически появляются в Redmine, если их автор также является пользователем Redmine."
