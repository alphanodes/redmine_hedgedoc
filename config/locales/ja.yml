  field_hedgedoc_permission: "権限"
  label_hedgedoc_list_info_html: "<strong>重要:</strong> 自分のパッドと、タイトルがRedmineプロジェクトの識別子で始まる非公開でないパッド (例: \"testproject: 私のパッド\") がここに一覧表示されます。これらのパッドはそのプロジェクトの<em>すべての</em>メンバーに表示されます。<br />正しいプロジェクトのプレフィックスを持つパッドは、作成者がRedmineユーザーでもあれば自動的にRedmineに表示されることを、HedgeDocのユーザーに伝えてください。"
