  label_hedgedoc_list_info_html: "<strong>Důležité:</strong> Zobrazují se zde vaše vlastní pady a všechny pady, které nejsou soukromé, pokud jejich název začíná identifikátorem projektu v Redmine (např. \"testproject: Můj pad\"). Takové pady se zobrazují <em>všem</em> členům tohoto projektu.<br />Informujte své uživatele HedgeDoc, že pady se správnou předponou projektu se v Redmine zobrazí automaticky, pokud je jejich autor také uživatelem Redmine."
