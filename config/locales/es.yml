  label_hedgedoc_list_info_html: "<strong>Importante:</strong> Aquí aparecen tus propios pads y todos los pads que no son privados, si su título empieza por el identificador de un proyecto de Redmine (p. ej. \"testproject: Mi pad\"). Estos pads se muestran a <em>todos</em> los miembros de ese proyecto.<br />Informa a tus usuarios de HedgeDoc de que los pads con un prefijo de proyecto correcto aparecen automáticamente en Redmine, siempre que su autor también sea usuario de Redmine."
